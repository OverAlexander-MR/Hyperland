# Monitors 

# Monitor configuration via HDMI Manager
monitor = eDP-1,1920x1080@60.00,-1920x0,1
monitor = HDMI-A-1,1920x1200@59.95,0x0,1

# Dark Mode and Environment Variables
env = GTK_THEME,Dracula
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland
env = QT_QPA_PLATFORM,wayland;xcb
env = QT_QPA_PLATFORMTHEME,qt6ct


# Status bar :)
# exec-once=eww open bar
exec-once= waybar
exec-once = hypridle
exec-once = hyprctl reload
exec-once = hyprpaper

#Notification
exec-once=dunst
exec-once = ~/.config/quickshell/hyprquickpaper/restore.sh
# For screen sharing
#exec-once=dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
# For keyboard
exec-once=fcitx5 -D

# For lockscreen
# exec-once=swayidle -w timeout 200 'swaylock-fancy'
# exec-once = gtklock --daemonize
# exec-once=swayidle -w timeout 200 'gtklock'

# Almacena el historial de texto
exec-once = wl-paste --type text --watch cliphist store 
# Almacena imágenes
exec-once = wl-paste --type image --watch cliphist store

#Disk mount
exec-once = lxqt-policykit-agent

# Deslizar 3 dedos horizontalmente para cambiar de workspace
gesture = 3, horizontal, workspace

# Bluetooth
exec-once=blueman-applet # Make sure you have installed blueman

# Screen Sharing
exec-once=systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once=~/.config/hypr/scripts/screensharing.sh
# exec-once=~/.config/hypr/scripts/hdmi-manager/hdmi-watcher.sh

input { 
    kb_layout = latam, us
    kb_options = grp:ctrl_space_toggle
    follow_mouse = 1 
    force_no_accel = 0
    
    touchpad { 
        natural_scroll = 1
    } 
    sensitivity = 0.5

}

cursor {
    no_hardware_cursors = false
}


general {
    layout=dwindle
#    sensitivity=1.0 # for mouse cursor

    gaps_in=5
    gaps_out=10
    border_size=2
    col.active_border=0xff5e81ac
    col.inactive_border=0x66333333
}

decoration {
    rounding=18
    blur {
        enabled=1
        size=6 # minimum 1
        passes=2 # minimum 1, more passes = more resource intensive.
        new_optimizations = true
    }
}

# Blur for waybar
# blurls=waybar
blurls=lockscreen

animations {
    enabled=1
    # bezier=overshot,0.05,0.9,0.1,1.1
    bezier=overshot,0.13,0.99,0.29,1.1
    animation=windows,1,4,overshot,popin
    animation=fade,1,10,default
    animation=workspaces,1,6,overshot,slide
    animation=border,1,10,default
}

master {
  new_on_top=true
  #no_gaps_when_only = true
}

misc {
  disable_hyprland_logo=true
  disable_splash_rendering=true
  mouse_move_enables_dpms=true
  #vfr = false
}
windowrule {
    name = xwayland-video-bridge-fixes
    match:class = xwaylandvideobridge

    no_initial_focus = true
    no_focus = true
    no_anim = true
    no_blur = true
    max_size = 1 1
    opacity = 0.0
}
# sources
source = ~/.config/hypr/keybindings.conf
