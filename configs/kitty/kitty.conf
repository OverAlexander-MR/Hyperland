linux_display_server wayland
wayland_titlebar_color background

font_family JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto

font_size 13
background_opacity 0.7

# window settings
initial_window_width 95c
initial_window_height 35c
window_padding_width 20
confirm_os_window_close 0

# Upstream colors {{{

# Special
background #14151e 
foreground #98b0d3 

# Black
color0 #151720
color8 #4f5572 

# Red
color1 #dd6777
color9 #e26c7c

# Green
color2  #90ceaa
color10 #95d3af

# Yellow
color3  #ecd3a0
color11 #f1d8a5

# Blue
color4  #86aaec
color12 #8baff1

# Magenta
color5  #c296eb
color13 #c79bf0

# Cyan
color6  #93cee9
color14 #98d3ee

# White
color7  #cbced3
color15 #d0d3d8

# Cursor
cursor #cbced3
cursor_text_color #a5b6cf

# Selection highlight
selection_foreground #a5b6cf
selection_background #1c1e27


# The color for highlighting URLs on mouse-over
# url_color #9ece6a
url color #5de4c7

# Window borders
active_border_color #3d59a1
inactive_border_color #101014
bell_border_color #fffac2

# Tab bar
tab_bar_style fade
tab_fade 1
active_tab_foreground   #3d59a1
active_tab_background   #16161e
active_tab_font_style   bold
inactive_tab_foreground #787c99
inactive_tab_background #16161e
inactive_tab_font_style bold
tab_bar_background #101014

# Title bar
macos_titlebar_color #16161e

# {{{ Neovim integration
# Allow Neovim to handle clipboard
copy_on_selection yes
# Enable kitty graphics protocol for image previews in nvim
allow_hyperlinks yes
# Send proper escape sequences
term xterm-256color

# {{{ Keybindings
# Split navigation - pass through to Neovim
map ctrl+shift+h neighbors_group window b previous
map kitty_mod+t     new_tab_with_cwd
map kitty_mod+enter launch --location=split --cwd=current
map kitty_mod+\     launch --location=split --cwd=current

# Tab management
map ctrl+shift+l next_tab
map ctrl+shift+h previous_tab
map kitty_mod+right  neighboring_window right
map kitty_mod+left   neighboring_window left
map kitty_mod+up     neighboring_window up
map kitty_mod+down   neighboring_window down

# }}

# }}}

# {{{ Performance
sync 1
# }}

# {{{ Advanced
# Startup session
# linux_class kitty NVIM
# Allow remote control from nvim
allow_remote_control yes
listen_on unix:/tmp/kitty.sock
# }}
